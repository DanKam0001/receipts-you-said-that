<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Receipts Scripted Stage</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d0a12}#game{position:absolute;inset:0;width:100%;height:100%;display:block}#receiptOverlay{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;pointer-events:none}.stage-label{position:fixed;z-index:2;left:18px;bottom:14px;padding:8px 12px;border:2px solid #ffca28;border-radius:7px;background:rgba(12,12,15,.9);color:#ffdc65;font:900 16px/1 Arial,sans-serif;letter-spacing:1.4px;pointer-events:none}
</style></head><body><canvas id="game" aria-label="Scripted boss fight demo scene"></canvas><iframe id="receiptOverlay" title="Receipts overlay" src="/overlay.html?scripted=1"></iframe><div class="stage-label">SCRIPTED DEMO SCENE</div><script type="module">
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});let dpr=1;function resize(){dpr=Math.min(1.5,window.devicePixelRatio||1);canvas.width=Math.round(innerWidth*dpr);canvas.height=Math.round(innerHeight*dpr);ctx.setTransform(canvas.width/1920,0,0,canvas.height/1080,0,0)}window.addEventListener('resize',resize);resize();
async function loadTimeline(){const requested=new URLSearchParams(location.search).get('beats')||'stage-timeline.json';const relative=requested.startsWith('public/')?requested.slice(7):requested;const safe=/^[a-zA-Z0-9_-]+\.json$/.test(relative)?relative:'stage-timeline.json';try{const response=await fetch('/'+safe,{cache:'no-store'});if(!response.ok)throw Error('timeline not found');const data=await response.json();if(!Array.isArray(data.beats)||!Number.isFinite(data.durationSeconds))throw Error('invalid timeline');return data}catch{return {durationSeconds:90,beats:[{at:0,event:'calm-fight'},{at:40,event:'phase-two'},{at:40,until:52,event:'hero-health-drop'},{at:52,event:'hero-died'},{at:58,event:'new-attempt'}]}}}
function roundedRect(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function drawBackground(t){const sky=ctx.createLinearGradient(0,0,0,900);sky.addColorStop(0,'#17101f');sky.addColorStop(.64,'#352039');sky.addColorStop(1,'#743a32');ctx.fillStyle=sky;ctx.fillRect(0,0,1920,1080);ctx.fillStyle='#ffca28';ctx.globalAlpha=.72;for(let i=0;i<48;i++){const x=(i*397+83)%1920,y=(i*173+49)%570;ctx.fillRect(x,y,2+(i%3),2+(i%3))}ctx.globalAlpha=1;
ctx.fillStyle='#211724';ctx.beginPath();ctx.moveTo(0,700);for(let x=0;x<=1920;x+=160)ctx.lineTo(x,620+Math.sin(x*.009)*55+(x%3)*8);ctx.lineTo(1920,900);ctx.lineTo(0,900);ctx.fill();ctx.fillStyle='#40302c';ctx.fillRect(0,825,1920,255);ctx.fillStyle='#ffca28';ctx.globalAlpha=.18;ctx.fillRect(0,824,1920,5);ctx.globalAlpha=1;
for(let i=0;i<8;i++){const x=i*280-20,h=90+(i%3)*35;ctx.fillStyle=i%2?'#261b2b':'#30202b';ctx.fillRect(x,824-h,135,h);ctx.fillStyle='#ffca28';ctx.globalAlpha=.5;ctx.fillRect(x+18,824-h+24,5,35);ctx.fillRect(x+56,824-h+24,5,35);ctx.globalAlpha=1}ctx.fillStyle='rgba(255,202,40,.08)';ctx.beginPath();ctx.ellipse(960,830,640,120,0,0,Math.PI*2);ctx.fill()}
function drawHero(t,health,attempt){const x=360+Math.sin(t*1.3)*18,y=650;ctx.save();ctx.translate(x,y);const flash=(Math.floor(t*8)%2===0&&t>40&&t<52);ctx.fillStyle=flash?'#fff':'#ffca28';ctx.strokeStyle='#171019';ctx.lineWidth=12;
ctx.beginPath();ctx.arc(0,-106,39,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#201723';ctx.beginPath();ctx.arc(0,-111,31,Math.PI,Math.PI*2);ctx.fill();roundedRect(-48,-66,96,132,19,flash?'#fff':'#dfab2e');roundedRect(-41,52,34,98,10,'#17131c');roundedRect(12,52,34,98,10,'#17131c');roundedRect(-67,-48,30,88,13,'#ffca28');roundedRect(41,-48,30,88,13,'#ffca28');ctx.strokeStyle='#f6eee1';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(61,-6);ctx.lineTo(135,-102+Math.sin(t*6)*8);ctx.stroke();ctx.strokeStyle='#4d3126';ctx.lineWidth=15;ctx.beginPath();ctx.moveTo(47,-14);ctx.lineTo(74,-38);ctx.stroke();ctx.restore();
ctx.font='900 20px Arial';ctx.fillStyle='#fff';ctx.fillText('ATTEMPT '+attempt,285,864);ctx.fillStyle='#15111a';ctx.fillRect(244,889,230,19);ctx.fillStyle=health>30?'#ffca28':'#ee473f';ctx.fillRect(248,893,222*Math.max(0,health)/100,11)}
function drawBoss(t,phase){const x=1465+Math.sin(t*.8)*9,y=555,hit=(Math.floor(t*5)%9===0&&t<39)||(phase&&Math.floor(t*6)%7===0);const armor=hit?'#fff':phase?'#c23b46':'#d99b2d';ctx.save();ctx.translate(x,y);ctx.fillStyle=phase?'rgba(241,66,68,.12)':'rgba(255,202,40,.12)';ctx.beginPath();ctx.ellipse(0,120,280,350,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#17121b';ctx.strokeStyle='#09080c';ctx.lineWidth=18;
ctx.beginPath();ctx.moveTo(-148,-83);ctx.quadraticCurveTo(-280,-278,-114,-219);ctx.quadraticCurveTo(-65,-175,-76,-110);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(148,-83);ctx.quadraticCurveTo(280,-278,114,-219);ctx.quadraticCurveTo(65,-175,76,-110);ctx.fill();ctx.stroke();ctx.fillStyle=armor;ctx.beginPath();ctx.ellipse(0,25,184,229,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#32212b';ctx.beginPath();ctx.ellipse(0,-111,144,116,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle=phase?'#ffdf55':'#fff3bc';ctx.shadowColor=phase?'#ff4138':'#ffca28';ctx.shadowBlur=18;ctx.fillRect(-93,-138,62,24);ctx.fillRect(31,-138,62,24);ctx.shadowBlur=0;ctx.fillStyle='#17121b';ctx.beginPath();ctx.moveTo(-36,-61);ctx.quadraticCurveTo(0,-34,36,-61);ctx.lineTo(27,-42);ctx.lineTo(-27,-42);ctx.fill();for(let i=-2;i<=2;i++){ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(i*17-7,-60);ctx.lineTo(i*17+7,-60);ctx.lineTo(i*17,-40);ctx.fill()}roundedRect(-218,62,74,200,27,armor);roundedRect(144,62,74,200,27,armor);ctx.fillStyle='#ffca28';ctx.fillRect(-180,201,360,23);ctx.restore()}
function drawAttacks(t,phase,dead){if(dead)return;const cadence=phase?.95:2.3,elapsed=t%cadence;if(elapsed<.9){const x=420+(elapsed/.9)*865,y=626-Math.sin(elapsed/.9*Math.PI)*96;ctx.strokeStyle='#ffe77b';ctx.lineWidth=8;ctx.shadowColor='#ffca28';ctx.shadowBlur=14;ctx.beginPath();ctx.moveTo(x-28,y+12);ctx.lineTo(x+28,y-12);ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#fff1aa';ctx.beginPath();ctx.arc(x,y,10,0,Math.PI*2);ctx.fill()}if(phase&&elapsed>cadence*.54){const p=(elapsed-cadence*.54)/(cadence*.46),x=1410-p*960,y=640;ctx.strokeStyle='rgba(247,65,57,.88)';ctx.lineWidth=12;ctx.shadowColor='#ff453a';ctx.shadowBlur=18;ctx.beginPath();ctx.moveTo(1390,635);ctx.lineTo(x,y);ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,13,0,Math.PI*2);ctx.fill()}}
function drawHud(t,health,attempt,phase,dead){ctx.font='900 25px Arial';ctx.fillStyle='#ffdc65';ctx.fillText('GOLDEN HOLLOW  /  THE LAST GATE',430,54);ctx.font='900 19px Arial';ctx.fillStyle='#fff';ctx.fillText(phase?'PHASE II — THE ASHEN KING':'PHASE I — THE WATCHER',430,82);ctx.font='900 19px Arial';ctx.fillStyle='#fff';ctx.fillText('HERO',70,127);roundedRect(145,101,470,32,8,'#17121b');roundedRect(150,106,460,22,5,'#34262e');ctx.fillStyle=health>30?'#ffca28':'#ef4944';ctx.fillRect(153,109,454*Math.max(0,health)/100,16);ctx.font='900 16px Arial';ctx.fillStyle='#fff';ctx.fillText(Math.round(health)+'%',625,125);
ctx.textAlign='right';ctx.fillText('BOSS',1850,127);roundedRect(1320,101,470,32,8,'#17121b');roundedRect(1325,106,460,22,5,'#34262e');ctx.fillStyle=phase?'#e34b45':'#ffca28';ctx.fillRect(1328,109,454*(attempt===2?.76:.91),16);ctx.textAlign='left';ctx.fillStyle='#ffda5b';ctx.font='800 18px Arial';ctx.fillText('DODGE THE SWEEP  ·  STRIKE WHEN THE GLOW FADES',70,1020);if(dead){ctx.fillStyle='rgba(8,5,10,.58)';ctx.fillRect(0,0,1920,1080);ctx.save();ctx.translate(960,472);ctx.rotate(-.035);ctx.fillStyle='#151016';ctx.strokeStyle='#ffca28';ctx.lineWidth=7;ctx.fillRect(-410,-97,820,194);ctx.strokeRect(-410,-97,820,194);ctx.fillStyle='#f5eee8';ctx.font='1000 104px Impact,Arial Black,sans-serif';ctx.textAlign='center';ctx.fillText('YOU DIED',0,34);ctx.font='900 22px Arial';ctx.fillStyle='#ffdc65';ctx.fillText('THE GATE REMAINS',0,72);ctx.restore()}ctx.textAlign='left'}
const timeline=await loadTimeline(),began=performance.now();function beat(event){return timeline.beats.find(item=>item.event===event)?.at??Infinity}const phaseAt=beat('phase-two'),drop=timeline.beats.find(item=>item.event==='hero-health-drop')||{at:40,until:52},deathAt=beat('hero-died'),attemptAt=beat('new-attempt'),retryFight=52,retryGap=6,retryCycle=retryFight+retryGap;function frame(now){const t=(now-began)/1000,retryElapsed=Math.max(0,t-attemptAt),cycleElapsed=retryElapsed%retryCycle,attempt=t<attemptAt?1:2+Math.floor(retryElapsed/retryCycle),phase=t>=phaseAt;let dead,health;if(t<deathAt){dead=false;health=t<drop.at?100:t<drop.until?100-(t-drop.at)/Math.max(.001,drop.until-drop.at)*100:0}else if(t<attemptAt){dead=true;health=0}else{dead=cycleElapsed>=retryFight;health=dead?0:100*(1-cycleElapsed/retryFight)}health=Math.max(0,health);drawBackground(t);ctx.save();const shaking=(t>=drop.at&&t<drop.until)||(t>=attemptAt&&cycleElapsed>retryFight-2&&!dead);if(phase&&shaking)ctx.translate(Math.sin(t*51)*7,Math.cos(t*43)*5);drawAttacks(t,phase,dead);drawHero(t,health,attempt);drawBoss(t,phase);ctx.restore();drawHud(t,health,attempt,phase,dead);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
