<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Receipts Live Proof</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08080c;color:#fff;font:22px Arial,sans-serif;text-align:center}.card{padding:48px;border:4px solid #ffca28;border-radius:24px;background:#19191f;max-width:900px}h1{font:900 64px Impact,'Arial Black',sans-serif;color:#ffca28;margin:0 0 20px}.mode{font-size:36px;font-weight:900}.state{margin:20px 0;color:#bfc3cc}.note{font-size:16px;color:#999}a{color:#ffca28}</style></head>
<body><main class="card"><h1>RECEIPTS · LIVE PROOF</h1><div id="mode" class="mode">Checking connection…</div><div id="state" class="state"></div><p class="note">This page shows the active chat source and EventSub connection only. It never displays credentials or tokens.</p><a href="/control">Local control page</a></main>
<script>async function refresh(){try{const s=await(await fetch('/api/state',{cache:'no-store'})).json();const real=s.source==='twitch';document.querySelector('#mode').textContent=real?'REAL TWITCH EVENTSUB':'SIMULATED CHAT';document.querySelector('#state').textContent=real?(s.eventsubConnected?'EventSub WebSocket connected':'Twitch source configured · awaiting EventSub connection'):'Demo chat source active';}catch{document.querySelector('#mode').textContent='STATUS UNAVAILABLE'}}refresh();setInterval(refresh,1000);</script></body></html>
