<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Receipts Overlay</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Impact,'Arial Black',Arial,sans-serif;color:#fff}
.labels{position:fixed;top:14px;left:18px;display:flex;gap:8px;z-index:5}.tag{display:none;background:#ffca28;color:#111;border:2px solid #111;border-radius:7px;padding:7px 11px;font:900 16px/1 Arial,sans-serif;letter-spacing:1px;box-shadow:0 2px 0 #111}
.status{position:fixed;top:14px;right:18px;z-index:5;display:flex;align-items:center;gap:14px;padding:8px 12px;border:2px solid #ffca28;border-radius:10px;background:rgba(12,12,15,.91);font:900 17px/1 Arial,sans-serif;white-space:nowrap;text-shadow:0 1px #000}.status .lifetime{color:#ffdc65}.hearts{display:flex;gap:3px;font:900 23px/1 Arial,sans-serif}.heart-live{color:#ff4058}.heart-lost{color:#777}
.wrap{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:calc(100% - 36px);height:min(34vh,360px);min-height:0;max-height:34vh;pointer-events:none;text-align:center}.panel{position:relative;width:100%;height:100%;padding:50px 26px 8px;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;border:3px solid rgba(255,255,255,.96);border-radius:19px;background:linear-gradient(180deg,rgba(12,12,15,.86),rgba(12,12,15,.97));box-shadow:0 5px 0 rgba(0,0,0,.7),0 0 22px rgba(0,0,0,.34);overflow:hidden}
.stamp{position:absolute;top:10px;left:50%;transform:translateX(-50%) rotate(-2deg);z-index:2;max-width:94%;padding:5px 23px 7px;border:3px solid #111;border-radius:9px;background:#ffca28;color:#111;font-size:clamp(38px,4vw,58px);line-height:.85;letter-spacing:1px;white-space:nowrap;text-shadow:1px 2px 0 rgba(0,0,0,.22);filter:drop-shadow(0 3px 0 #111)}.stamp.slam{animation:slam .62s cubic-bezier(.18,.85,.25,1.25)}@keyframes slam{0%{transform:translateX(-50%) scale(1.8) rotate(6deg);opacity:0}65%{transform:translateX(-50%) scale(.92) rotate(-4deg);opacity:1}100%{transform:translateX(-50%) scale(1) rotate(-2deg);opacity:1}}.stamp.found{background:#ffca28;color:#111}.stamp.miss{background:#e64039;color:#fff}.stamp.uncertain{background:#80e9ff;color:#111}
.claim{flex:none;min-height:19px;color:#ffe99c;font:800 18px/1.12 Arial,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 3px #000}.quote{flex:none;width:100%;max-height:calc(3 * 1.05em);margin:0 auto;color:#fff;font:900 var(--quote-size,50px)/1.05 Arial,sans-serif;overflow:hidden;overflow-wrap:anywhere;text-shadow:0 2px 3px #000}.word{display:inline;padding:0 .025em;border-radius:.10em;-webkit-box-decoration-break:clone;box-decoration-break:clone}.word.active{color:#17130c;background:#ffdf55;text-shadow:none}
.reason{display:none;flex:none;color:#fff;font:900 25px/1.1 Arial,sans-serif;text-shadow:0 2px 4px #000}.reason.visible{display:block}.reason-icon{display:none;color:#ff4058;font:900 29px/1 Arial,sans-serif}.reason-icon.visible{display:inline-block;margin-right:8px}.meta{flex:none;color:#ffda5b;font:900 15px/1.1 Arial,sans-serif;letter-spacing:.5px;text-shadow:0 2px 3px #000}.veto-wrap{display:none;flex:none}.veto-wrap.visible{display:block}.veto-label{font:900 13px/1.1 Arial,sans-serif;letter-spacing:1px}.veto{height:13px;margin:3px auto 0;border:2px solid #fff;border-radius:12px;background:#333;overflow:hidden}.veto-fill{height:100%;width:0;background:linear-gradient(90deg,#ff684e,#ffcf38);transform-origin:left}.wave{display:none;flex:none;width:min(100%,1100px);height:32px;margin:0 auto}.wave.visible{display:block}.idle{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.82);font:900 18px/1 Arial,sans-serif;letter-spacing:2px;text-shadow:0 2px 5px #000}.health{position:fixed;left:18px;bottom:14px;max-width:45%;padding:7px 10px;border:2px solid #ffb74d;border-radius:7px;background:#1c120f;color:#fff;font:700 14px/1.15 Arial;display:none;text-shadow:0 2px 3px #000;z-index:6}
</style></head><body>
<div class="labels"><span id="sim" class="tag">SIMULATED CHAT</span><span id="scripted" class="tag">SCRIPTED AUDIO</span></div>
<div class="status"><span class="lifetime">STREAMER ON RECORD: <span id="lifetime">0 RECEIPTS</span></span><span class="lives-label">LIVES</span><span id="hearts" class="hearts"></span></div><div id="health" class="health" role="status"></div>
<main class="wrap"><section id="panel" class="panel" style="display:none"><div id="stamp" class="stamp"></div><div id="claim" class="claim"></div><div id="quote" class="quote"></div><div id="reason" class="reason"><span id="reasonIcon" class="reason-icon"></span><span id="reasonText"></span></div><div id="vetoWrap" class="veto-wrap"><div class="veto-label">MOD VETO WINDOW</div><div class="veto"><div id="vetoFill" class="veto-fill"></div></div></div><canvas id="wave" class="wave" width="1100" height="50"></canvas><div id="meta" class="meta"></div></section><div id="idle" class="idle">RECEIPTS IS LISTENING</div></main>
<script type="module">
import {fitQuote,receiptCountLabel} from '/overlay-layout.js';
const ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}`),stamp=document.querySelector('#stamp'),panel=document.querySelector('#panel'),claimLine=document.querySelector('#claim'),quote=document.querySelector('#quote'),reason=document.querySelector('#reason'),reasonIcon=document.querySelector('#reasonIcon'),reasonText=document.querySelector('#reasonText'),meta=document.querySelector('#meta'),health=document.querySelector('#health'),vetoWrap=document.querySelector('#vetoWrap'),vetoFill=document.querySelector('#vetoFill'),wave=document.querySelector('#wave'),waveCtx=wave.getContext('2d');
let lastReceipt='',lastPlayed='',activeAudio=null,activeReceipt=null,analyser=null,audioContext=null,frequency=null,clearTimer=null,visibleStart=0,visibleEnd=0,lastFitKey='';
const params=new URLSearchParams(location.search);if(params.get('scripted')==='1')document.querySelector('#scripted').style.display='inline-block';
function renderHearts(lives,max){const root=document.querySelector('#hearts');root.replaceChildren();for(let i=0;i<max;i++){const h=document.createElement('span');h.className=i<lives?'heart-live':'heart-lost';h.textContent=i<lives?'♥':'♡';root.append(h)}}
function quoteWords(){return activeReceipt?.quote?.match(/\S+/g)||[]}
function renderQuote(activeIndex=0){if(!activeReceipt?.quote)return;const fit=fitQuote(activeReceipt.quote,Math.max(1,quote.clientWidth||1800),activeIndex);const key=`${fit.startWord}:${fit.endWord}:${fit.fontSize}:${fit.text}`;if(key===lastFitKey)return;lastFitKey=key;visibleStart=fit.startWord;visibleEnd=fit.endWord;quote.style.setProperty('--quote-size',fit.fontSize+'px');quote.replaceChildren();const all=quoteWords();let local=0;for(const token of fit.text.match(/\S+|\s+/g)||[]){if(/^\s+$/.test(token)){quote.append(document.createTextNode(token));continue}const isEllipsis=token==='…';const span=document.createElement('span');span.className='word';span.textContent=token;if(!isEllipsis){span.dataset.word=String(visibleStart+local);local++}quote.append(span)} }
function activeWordIndex(){if(!activeAudio||!activeReceipt)return 0;const times=activeReceipt.quoteWords||[],absolute=(activeReceipt.clipStart??activeReceipt.timestamp)+activeAudio.currentTime;if(times.length){const i=times.findIndex(w=>absolute>=w.start&&absolute<=w.end);if(i>=0)return i;const next=times.findIndex(w=>w.start>absolute);return next<0?times.length-1:next}const count=quoteWords().length,duration=Math.max(.05,(activeReceipt.quoteEnd??activeReceipt.clipEnd??activeReceipt.timestamp+1)-activeReceipt.timestamp),elapsed=Math.max(0,absolute-activeReceipt.timestamp);return Math.min(count-1,Math.floor(Math.min(1,elapsed/duration)*count))}
function updateWord(){if(!activeAudio||!activeReceipt?.quote)return;const idx=activeWordIndex();if(idx<visibleStart||idx>=visibleEnd)renderQuote(idx);quote.querySelectorAll('.word[data-word]').forEach(word=>word.classList.toggle('active',Number(word.dataset.word)===idx))}
function drawWave(){if(!activeAudio||activeAudio.paused){wave.classList.remove('visible');waveCtx.clearRect(0,0,wave.width,wave.height);return}wave.classList.add('visible');const w=wave.width,h=wave.height;waveCtx.clearRect(0,0,w,h);waveCtx.lineWidth=4;waveCtx.strokeStyle='#ffca28';waveCtx.shadowColor='#ffca28';waveCtx.shadowBlur=9;waveCtx.beginPath();const n=64;if(analyser)analyser.getByteFrequencyData(frequency);for(let i=0;i<n;i++){const x=i/(n-1)*w,amp=analyser?frequency[Math.floor(i*frequency.length/n)]/255:0.15+0.75*Math.abs(Math.sin(Date.now()/120+i*.7))*Math.max(.2,Math.sin(Math.PI*activeAudio.currentTime/Math.max(.1,activeAudio.duration))),y=h/2+(amp-.5)*h*.86;if(i===0)waveCtx.moveTo(x,y);else waveCtx.lineTo(x,y)}waveCtx.stroke();waveCtx.shadowBlur=0;updateWord();requestAnimationFrame(drawWave)}
async function play(r){activeReceipt=r;lastPlayed=r.id;activeAudio=new Audio('/api/clip/'+encodeURIComponent(r.id));activeAudio.preload='auto';activeAudio.addEventListener('timeupdate',updateWord);activeAudio.addEventListener('ended',()=>{activeAudio=null;wave.classList.remove('visible');quote.querySelectorAll('.word').forEach(w=>w.classList.remove('active'))});try{audioContext=new AudioContext();analyser=audioContext.createAnalyser();analyser.fftSize=128;frequency=new Uint8Array(analyser.frequencyBinCount);const source=audioContext.createMediaElementSource(activeAudio);source.connect(analyser);analyser.connect(audioContext.destination);await audioContext.resume()}catch{analyser=null}activeAudio.play().then(drawWave).catch(()=>{})}
function tickVeto(r,hold){if(r?.outcome!=='RECEIPT FOUND'||r.status!=='pending'||!r.vetoUntil){vetoWrap.classList.remove('visible');vetoFill.style.width='0%';return}vetoWrap.classList.add('visible');vetoFill.style.width=(100*Math.min(1,Math.max(0,r.vetoUntil-Date.now())/Math.max(1,hold)))+'%'}
setInterval(()=>{const s=window.lastState;if(s){tickVeto(s.receipt,s.holdMs);if(activeAudio&&!activeAudio.paused)updateWord()}},50);window.addEventListener('resize',()=>{lastFitKey='';if(activeReceipt?.quote)renderQuote(activeWordIndex())});
ws.onmessage=({data})=>{const m=JSON.parse(data),r=m.receipt;window.lastState=m;document.querySelector('#sim').style.display=m.simulated?'inline-block':'none';document.querySelector('#scripted').style.display=(params.get('scripted')==='1'||m.scriptedAudio)?'inline-block':'none';document.querySelector('#lifetime').textContent=receiptCountLabel(m.lifetimeReceiptCount??0);renderHearts(m.lives??0,m.maxLives??3);const a=m.asr||{},showHealth=a.state&&a.state!=='stopped'&&(a.state!=='ready'||(a.lastRtf??0)>1);health.style.display=showHealth?'block':'none';health.textContent=showHealth?'LOCAL SPEECH: '+(a.message||a.state)+' | waiting '+Number(a.queuedAudioSeconds||0).toFixed(1)+'s':'';if(!r){document.querySelector('#idle').style.display='block';panel.style.display='none';return}document.querySelector('#idle').style.display='none';panel.style.display='block';stamp.textContent=r.outcome;stamp.className='stamp '+(r.outcome==='RECEIPT FOUND'?'found':r.outcome==='NO MATCH'?'miss':'uncertain');if(lastReceipt!==r.id){if(activeAudio&&activeReceipt?.id!==r.id){activeAudio.pause();activeAudio=null;wave.classList.remove('visible')}lastReceipt=r.id;stamp.classList.remove('slam');void stamp.offsetWidth;stamp.classList.add('slam');lastFitKey=''}if(r.outcome==='RECEIPT FOUND'&&r.quote){claimLine.style.display='block';claimLine.textContent=`${r.requester}: “${r.query}”`;reason.classList.remove('visible');reasonIcon.classList.remove('visible');quote.style.display='block';activeReceipt=r;renderQuote(activeAudio?activeWordIndex():0);meta.textContent='STREAM TIME '+new Date(r.timestamp*1000).toISOString().slice(11,19)+' · ENTAILMENT '+Number(r.score??0).toFixed(3)+' · '+(r.candidateId||'NO CANDIDATE');if(r.status==='played'&&lastPlayed!==r.id)void play(r)}else{claimLine.style.display='block';claimLine.textContent=`${r.requester}: “${r.query}”`;quote.style.display='none';reason.classList.add('visible');reasonIcon.textContent=r.outcome==='NO MATCH'?'💔':'';reasonIcon.classList.toggle('visible',r.outcome==='NO MATCH');reasonText.textContent=r.outcome==='NO MATCH'?'No match. Chat loses a life.':"Can't tell. No life lost.";meta.textContent='ENTAILMENT '+Number(r.score??0).toFixed(3)+' · '+(r.candidateId||'NO CANDIDATE')}clearTimeout(clearTimer);clearTimer=setTimeout(()=>{panel.style.display='none';document.querySelector('#idle').style.display='block'},18000)};
</script></body></html>
