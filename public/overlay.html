<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Receipts Overlay</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden;font-family:Impact,'Arial Black',sans-serif;color:#fff}.wrap{position:absolute;left:50%;top:11%;transform:translateX(-50%);width:1320px;text-align:center;text-shadow:0 5px 0 #151515,3px 6px 12px #000}.sim{position:fixed;top:32px;left:32px;background:#ffca28;color:#111;padding:12px 20px;font:900 30px Arial;letter-spacing:2px;display:none}.stamp{font-size:clamp(76px,8vw,150px);line-height:.96;-webkit-text-stroke:3px #111;letter-spacing:2px;transform:rotate(-2deg);filter:drop-shadow(0 12px 0 #111)}.found{color:#ffca28}.miss{color:#ff5c4d}.uncertain{color:#71e6ff}.panel{margin:22px auto 0;padding:24px 36px;background:#111e;border:5px solid #fff;border-radius:18px;max-width:1180px;font:700 44px/1.25 Arial,sans-serif;text-shadow:0 3px 2px #000}.quote{font-size:56px;color:#fff}.meta{color:#ffca28;font-size:34px;margin-top:12px}.lives{position:fixed;right:48px;top:42px;background:#111e;border:4px solid #fff;border-radius:16px;padding:14px 24px;font:900 32px Arial}.idle{font:700 30px Arial;color:#fff8}
</style></head><body>
<div id="sim" class="sim">SIMULATED CHAT</div><div class="lives">CHAT LIVES <span id="lives">3</span></div>
<main class="wrap"><div id="stamp" class="stamp"></div><div id="panel" class="panel" style="display:none"></div><div id="idle" class="idle">Receipts is listening</div></main>
<script>
const ws=new WebSocket(`ws://${location.host}`),stamp=document.querySelector('#stamp'),panel=document.querySelector('#panel');let clear,lastPlayed='';
ws.onmessage=({data})=>{const m=JSON.parse(data);document.querySelector('#lives').textContent=m.lives;document.querySelector('#sim').style.display=m.simulated?'block':'none';if(!m.receipt){document.querySelector('#idle').style.display='block';stamp.textContent='';panel.style.display='none';return}const r=m.receipt;document.querySelector('#idle').style.display='none';stamp.textContent=r.outcome;stamp.className='stamp '+(r.outcome==='RECEIPT FOUND'?'found':r.outcome==='NO MATCH'?'miss':'uncertain');panel.style.display='block';panel.replaceChildren();if(r.quote){const q=document.createElement('div');q.className='quote';q.textContent='"'+r.quote+'"';panel.append(q);const c=document.createElement('div');c.textContent=r.context||'';panel.append(c);const t=document.createElement('div');t.className='meta';t.textContent='STREAM TIME '+new Date(r.timestamp*1000).toISOString().slice(11,19)+' | '+r.status.toUpperCase()+' | SCORE '+(r.score??0).toFixed(2);panel.append(t);if(r.status==='played'&&lastPlayed!==r.id){lastPlayed=r.id;const a=new Audio('/api/clip/'+encodeURIComponent(r.id));a.play().catch(()=>{})}}else{const result=document.createElement('div');result.textContent=r.outcome==='NO MATCH'?'Claim not found | chat loses a life':r.reason||'Transcript is unclear | no life lost';panel.append(result);const score=document.createElement('div');score.className='meta';score.textContent='MATCH SCORE '+(r.score??0).toFixed(2);panel.append(score)}clearTimeout(clear);clear=setTimeout(()=>{stamp.textContent='';panel.style.display='none';document.querySelector('#idle').style.display='block'},12000)};
</script></body></html>
