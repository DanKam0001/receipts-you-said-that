<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Receipts Overlay</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden;font-family:Impact,'Arial Black',sans-serif;color:#fff}
.sim{position:fixed;top:28px;left:32px;padding:14px 22px;background:#ffca28;color:#111;border:4px solid #111;border-radius:12px;font:900 28px Arial;letter-spacing:2px;display:none;box-shadow:0 6px 0 #111}
.lifetime{position:fixed;left:32px;top:104px;color:#fff;background:#121218eF;border:3px solid #ffca28;border-radius:12px;padding:12px 18px;font:900 26px Arial;letter-spacing:1px;text-shadow:0 2px 4px #000}
.lives{position:fixed;right:34px;top:28px;min-width:270px;text-align:center;background:#121218eF;border:4px solid #fff;border-radius:18px;padding:12px 20px;box-shadow:0 7px 0 #111}.lives-label{font:900 24px Arial;letter-spacing:2px}.hearts{display:flex;justify-content:center;gap:8px;margin-top:2px;font:900 64px/1 Arial}.heart-live{color:#ff4058;text-shadow:0 3px 0 #4a0812}.heart-lost{color:#595960}
.wrap{position:absolute;left:50%;top:17%;transform:translateX(-50%);width:86%;max-width:1660px;text-align:center;text-shadow:0 5px 0 #151515,3px 6px 12px #000}.stamp{font-size:clamp(110px,10vw,190px);line-height:.92;-webkit-text-stroke:4px #111;letter-spacing:2px;filter:drop-shadow(0 14px 0 #111);transform:rotate(-2deg);transform-origin:center}.stamp.slam{animation:slam .72s cubic-bezier(.18,.85,.25,1.25)}@keyframes slam{0%{transform:scale(2.5) rotate(9deg);opacity:0}65%{transform:scale(.88) rotate(-4deg);opacity:1}100%{transform:scale(1) rotate(-2deg);opacity:1}}
.found{color:#ffca28}.miss{color:#ff5c4d}.uncertain{color:#75e8ff}.panel{margin:20px auto 0;padding:22px 38px 18px;background:#111e;border:5px solid #fff;border-radius:20px;max-width:100%;font:800 42px/1.18 Arial,sans-serif;text-shadow:0 3px 2px #000;box-shadow:0 12px 0 #1119}.quote{font-size:clamp(54px,5vw,88px);line-height:1.08;color:#fff;overflow-wrap:anywhere}.word{border-radius:8px;padding:0 2px}.word.active{color:#151515;background:#ffdf55;text-shadow:none;box-shadow:0 0 14px #ffdf55}.context{font-size:clamp(34px,3vw,52px);line-height:1.18;color:#d8d8df;margin-top:14px}.meta{color:#ffca28;font:900 28px Arial,sans-serif;letter-spacing:1px;margin-top:12px}
.veto{height:24px;position:relative;margin:17px auto 4px;border:3px solid #fff;border-radius:20px;background:#333;overflow:hidden}.veto-fill{height:100%;width:0;background:linear-gradient(90deg,#ff684e,#ffcf38);transform-origin:left}.veto-label{font:900 22px Arial;letter-spacing:2px}.veto-wrap{display:none}.veto-wrap.visible{display:block}
.wave{width:100%;height:98px;margin-top:10px;display:none}.wave.visible{display:block}.idle{font:900 42px Arial;color:#fffb;letter-spacing:2px;text-shadow:0 4px 7px #000}.health{position:fixed;left:32px;bottom:25px;max-width:900px;padding:12px 18px;border:3px solid #ffb74d;border-radius:12px;background:#1c120f;color:#fff;font:700 24px/1.25 Arial;display:none;text-shadow:0 2px 3px #000}
</style></head><body>
<div id="sim" class="sim">SIMULATED CHAT</div><div class="lifetime">STREAMER ON RECORD: <span id="lifetime">0</span> RECEIPTS</div>
<div class="lives"><div class="lives-label">CHAT LIVES</div><div id="hearts" class="hearts"></div></div><div id="health" class="health" role="status"></div>
<main class="wrap"><div id="stamp" class="stamp"></div><section id="panel" class="panel" style="display:none"><div id="quote" class="quote"></div><div id="context" class="context"></div><div id="vetoWrap" class="veto-wrap"><div class="veto-label">MOD VETO WINDOW</div><div class="veto"><div id="vetoFill" class="veto-fill"></div></div></div><canvas id="wave" class="wave" width="1500" height="100"></canvas><div id="meta" class="meta"></div></section><div id="idle" class="idle">RECEIPTS IS LISTENING</div></main>
<script>
const ws=new WebSocket(`ws://${location.host}`),stamp=document.querySelector('#stamp'),panel=document.querySelector('#panel'),quote=document.querySelector('#quote'),context=document.querySelector('#context'),meta=document.querySelector('#meta'),health=document.querySelector('#health'),vetoWrap=document.querySelector('#vetoWrap'),vetoFill=document.querySelector('#vetoFill'),wave=document.querySelector('#wave'),waveCtx=wave.getContext('2d');
let lastReceipt='',lastPlayed='',activeAudio=null,activeReceipt=null,analyser=null,audioContext=null,frequency=null,clearTimer=null;
function renderHearts(lives,max){const root=document.querySelector('#hearts');root.replaceChildren();for(let i=0;i<max;i++){const h=document.createElement('span');h.className='heart '+(i<lives?'heart-live':'heart-lost');h.textContent=i<lives?'♥':'♡';root.append(h)}}
function renderQuote(text){quote.replaceChildren();const parts=text.match(/\S+|\s+/g)||[];let index=0;for(const part of parts){if(/^\s+$/.test(part)){quote.append(document.createTextNode(part));continue}const span=document.createElement('span');span.className='word';span.dataset.index=String(index++);span.textContent=part;quote.append(span)}}
function updateWord(){if(!activeAudio||!activeReceipt||!activeReceipt.quote)return;const duration=Math.max(.05,(activeReceipt.quoteEnd??activeReceipt.clipEnd??activeReceipt.timestamp+1)-activeReceipt.timestamp);const elapsed=Math.max(0,(activeReceipt.clipStart??activeReceipt.timestamp)+activeAudio.currentTime-activeReceipt.timestamp);const words=quote.querySelectorAll('.word');const active=Math.min(words.length-1,Math.floor(Math.min(1,elapsed/duration)*words.length));words.forEach((word,index)=>word.classList.toggle('active',index===active))}
function drawWave(){if(!activeAudio||activeAudio.paused){wave.classList.remove('visible');waveCtx.clearRect(0,0,wave.width,wave.height);return}wave.classList.add('visible');const w=wave.width,h=wave.height;waveCtx.clearRect(0,0,w,h);waveCtx.lineWidth=5;waveCtx.strokeStyle='#ffca28';waveCtx.shadowColor='#ffca28';waveCtx.shadowBlur=12;waveCtx.beginPath();const n=64;if(analyser){analyser.getByteFrequencyData(frequency)}for(let i=0;i<n;i++){const x=i/(n-1)*w;let amp=analyser?frequency[Math.floor(i*frequency.length/n)]/255:0.15+0.75*Math.abs(Math.sin((Date.now()/120)+(i*.7)))*Math.max(.2,Math.sin(Math.PI*(activeAudio.currentTime/Math.max(.1,activeAudio.duration))));const y=h/2+(amp-.5)*h*.9;if(i===0)waveCtx.moveTo(x,y);else waveCtx.lineTo(x,y)}waveCtx.stroke();waveCtx.shadowBlur=0;updateWord();requestAnimationFrame(drawWave)}
async function play(r){activeReceipt=r;lastPlayed=r.id;activeAudio=new Audio('/api/clip/'+encodeURIComponent(r.id));activeAudio.preload='auto';activeAudio.addEventListener('timeupdate',updateWord);activeAudio.addEventListener('ended',()=>{activeAudio=null;wave.classList.remove('visible');quote.querySelectorAll('.word').forEach(w=>w.classList.remove('active'))});try{audioContext=new AudioContext();analyser=audioContext.createAnalyser();analyser.fftSize=128;frequency=new Uint8Array(analyser.frequencyBinCount);const source=audioContext.createMediaElementSource(activeAudio);source.connect(analyser);analyser.connect(audioContext.destination);await audioContext.resume()}catch{analyser=null}activeAudio.play().then(drawWave).catch(()=>{});}
function tickVeto(r,hold){if(r?.outcome!=='RECEIPT FOUND'||r.status!=='pending'||!r.vetoUntil){vetoWrap.classList.remove('visible');vetoFill.style.width='0%';return}vetoWrap.classList.add('visible');const remaining=Math.max(0,r.vetoUntil-Date.now());vetoFill.style.width=(100*Math.min(1,remaining/Math.max(1,hold)))+'%'}
setInterval(()=>{const s=window.lastState;if(s){tickVeto(s.receipt,s.holdMs);if(activeAudio&&!activeAudio.paused)updateWord()}},40);
ws.onmessage=({data})=>{const m=JSON.parse(data),r=m.receipt;window.lastState=m;document.querySelector('#sim').style.display=m.simulated?'block':'none';document.querySelector('#lifetime').textContent=m.lifetimeReceiptCount??0;renderHearts(m.lives??0,m.maxLives??3);const a=m.asr||{},showHealth=a.state&&a.state!=='stopped'&&(a.state!=='ready'||(a.lastRtf??0)>1);health.style.display=showHealth?'block':'none';health.textContent=showHealth?'LOCAL SPEECH: '+(a.message||a.state)+' | waiting '+Number(a.queuedAudioSeconds||0).toFixed(1)+'s':'';if(!r){document.querySelector('#idle').style.display='block';stamp.textContent='';panel.style.display='none';return}document.querySelector('#idle').style.display='none';panel.style.display='block';stamp.textContent=r.outcome;stamp.className='stamp '+(r.outcome==='RECEIPT FOUND'?'found':r.outcome==='NO MATCH'?'miss':'uncertain');if(lastReceipt!==r.id){lastReceipt=r.id;stamp.classList.remove('slam');void stamp.offsetWidth;stamp.classList.add('slam')}if(r.quote){renderQuote(r.quote);context.textContent=r.context||'';meta.textContent='STREAM TIME '+new Date(r.timestamp*1000).toISOString().slice(11,19)+' · '+r.status.toUpperCase()+' · ENTAILMENT '+Number(r.score??0).toFixed(3)+' · '+(r.candidateId||'NO CANDIDATE');if(r.status==='played'&&lastPlayed!==r.id)void play(r)}else{quote.textContent=r.outcome==='NO MATCH'?'CLAIM NOT FOUND — CHAT LOSES A LIFE':r.reason||'TRANSCRIPT UNCLEAR — NO LIFE LOST';context.textContent='';meta.textContent='ENTAILMENT '+Number(r.score??0).toFixed(3)+' · '+(r.candidateId||'NO CANDIDATE')}clearTimeout(clearTimer);clearTimer=setTimeout(()=>{stamp.textContent='';panel.style.display='none';document.querySelector('#idle').style.display='block'},18000)};
</script></body></html>
