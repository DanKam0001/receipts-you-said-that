<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Receipts Control</title><style>body{font:18px Arial;background:#171717;color:#fff;max-width:760px;margin:40px auto;padding:0 24px}h1{font-size:44px;color:#ffca28}section{background:#262626;padding:24px;border-radius:14px;margin:16px 0}button{font-size:18px;font-weight:bold;padding:12px 18px;margin:8px 8px 0 0;cursor:pointer}input{font-size:18px;padding:12px;width:100%;margin:8px 0}label{display:block;margin:10px 0}.danger{background:#e94c3d;color:white}#status{white-space:pre-wrap}</style></head><body><h1>RECEIPTS — CONTROL</h1><section><h2>Broadcaster opt-in</h2><button id="opt"></button><p>Receipts are disabled until you opt in.</p></section><section><h2>Simulated chat</h2><p>Demo-only chat events follow the same input interface as Twitch.</p><input id="claim" placeholder="!receipts <plain-language claim>"><button id="send">Send simulated chat message</button></section><section><h2>Veto</h2><p>Current pending receipt:</p><button id="veto" class="danger">VETO PENDING RECEIPT</button></section><section><h2>Audio source</h2><label>Replay file<input id="audio" placeholder="audio/demo.wav"></label><button id="replay">Start file replay</button><p>Live capture device name (DirectShow):</p><input id="device" placeholder="Microphone (device name)"><button id="live">Start live capture</button></section><section><h2>State</h2><div id="status"></div></section><script>
const req=async(path,body={})=>(await fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)})).json();document.querySelector('#opt').onclick=async()=>{const s=await req('/api/opt-in');document.querySelector('#opt').textContent=s.optedIn?'OPTED IN — click to opt out':'OPTED OUT — click to opt in'};document.querySelector('#send').onclick=async()=>{const text=document.querySelector('#claim').value;await req('/api/simulate',{text});document.querySelector('#claim').value=''};document.querySelector('#veto').onclick=()=>req('/api/veto');document.querySelector('#replay').onclick=()=>req('/api/replay',{path:document.querySelector('#audio').value});document.querySelector('#live').onclick=()=>req('/api/live',{device:document.querySelector('#device').value});const ws=new WebSocket(`ws://${location.host}`);ws.onmessage=({data})=>{const s=JSON.parse(data);document.querySelector('#opt').textContent=s.optedIn?'OPTED IN — click to opt out':'OPTED OUT — click to opt in';document.querySelector('#status').textContent=JSON.stringify({audio:s.audio,asr:s.asr,transcript:s.transcript,source:s.source,lives:s.lives,pending:s.receipt?.status},null,2)};
</script></body></html>
