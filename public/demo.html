<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Receipts scripted demo</title><style>
*{box-sizing:border-box}body{margin:0;background:#17131d;color:#fff;font:18px Arial,sans-serif}.wrap{max-width:980px;margin:30px auto;padding:24px}.labels{display:flex;gap:12px;flex-wrap:wrap}.tag{background:#ffca28;color:#151515;padding:10px 14px;border-radius:8px;font-weight:900;letter-spacing:1px}h1{font-size:44px;margin:24px 0 8px}.note{font-size:20px;color:#ddd;line-height:1.45}.buttons{display:grid;gap:12px;margin:24px 0}.claim,button{border:3px solid #ffca28;border-radius:12px;background:#292431;color:white;padding:16px;font-size:20px;font-weight:800;cursor:pointer;text-align:left}.claim small{display:block;color:#ffdc73;margin-top:5px}.form{display:flex;gap:8px}.form input{flex:1;min-width:0;padding:14px;font-size:18px;border-radius:8px}.form button{background:#ffca28;color:#111;text-align:center}.card{display:none;margin-top:24px;padding:24px;border:4px solid #fff;border-radius:16px;background:#26212e}.outcome{font-size:38px;font-weight:1000;color:#ffca28}.quote{font-size:26px;line-height:1.45;margin:12px 0}.links{margin-top:24px}.links a{color:#ffdc73;margin-right:18px;font-weight:800}
</style></head><body><main class="wrap"><div class="labels"><span class="tag">SCRIPTED AUDIO</span><span class="tag">SIMULATED CHAT</span></div><h1>Receipts: You Said That</h1><p class="note">A local demonstration using a 75-second excerpt of public-domain audiobook narration. These are scripted claims sent through simulated chat; this is not a real streamer or real viewers.</p><section class="buttons"><button class="claim" data-claim="you said she was tired of sitting by her sister">“you said she was tired of sitting by her sister”<small>preset</small></button><button class="claim" data-claim="you said the book had lots of pictures">“you said the book had lots of pictures”<small>preset</small></button><button class="claim" data-claim="you said the rabbit was wearing a blue jacket">“you said the rabbit was wearing a blue jacket”<small>try this · outcome not promised</small></button></section><form class="form" id="form"><input id="claim" maxlength="240" placeholder="Type a plain-language claim"><button>CHECK</button></form><section id="result" class="card"><div class="outcome" id="outcome"></div><div class="quote" id="quote"></div><div id="meta"></div><audio id="player" controls></audio></section><p class="links"><a href="/overlay.html">Open OBS overlay</a><a href="/proof">Demo mode proof</a></p></main><script>
const result=document.querySelector('#result'),outcome=document.querySelector('#outcome'),quote=document.querySelector('#quote'),meta=document.querySelector('#meta'),player=document.querySelector('#player');async function submitClaim(text){text=text.trim();if(text.length<4)return;result.style.display='block';outcome.textContent='CHECKING…';quote.textContent='';meta.textContent='';player.removeAttribute('src');await fetch('/api/simulate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:'demo_viewer',text:'!receipts '+text})});const ws=new WebSocket(`ws://${location.host}`);ws.onmessage=({data})=>{const state=JSON.parse(data),r=state.receipt;if(!r||r.query!==text)return;outcome.textContent=r.outcome;quote.textContent=r.quote||r.reason||'';meta.textContent=`ENTAILMENT ${Number(r.score||0).toFixed(3)} · ${r.candidateId||'NO CANDIDATE'}`;if(r.outcome==='RECEIPT FOUND')player.src='/api/clip/'+encodeURIComponent(r.id);ws.close()};setTimeout(()=>ws.close(),15000)}document.querySelectorAll('.claim').forEach(b=>b.onclick=()=>submitClaim(b.dataset.claim));document.querySelector('#form').onsubmit=e=>{e.preventDefault();submitClaim(document.querySelector('#claim').value)};
</script></body></html>
